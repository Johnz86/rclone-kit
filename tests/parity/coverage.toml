parity_test = "tests/native/test_mount_ops_embedded_integration.py::test_mount_s3_reads_a_real_file"
windows = true
linux = false
failure_contract_complete = true
notes = "Wave H addendum. Builds vfsOpt/mountOpt/flat-config fields directly instead of launch_s3_mount's --flag value strings, since embedded execution has no other_args list to append them to. Preserves launch_s3_mount's exact flag-to-field mapping bug-for-bug: vfs_disk_space_total_size sets vfsOpt.CacheMaxSize (the --vfs-cache-max-size flag), not the similarly-named vfsOpt.DiskSpaceTotalSize field, so CLI and embedded stay semantically identical for the same parameters. modtime_strategy is split across two option structs depending on its value: USE_SERVER_MODTIME is a global _config option, NO_MODTIME is a vfsOpt field."

