# Machine-readable coverage ledger for the CLI-to-C-ABI migration.
#
# Mirrors row IDs from `reference/rclone_cli_to_c_abi_migration_plan.md`'s
# public `Rclone` API migration ledger (C/M/L/T/F/R tables). This file is
# the source of truth CI reads to answer "is embedded coverage for this row
# actually proven" - the Markdown ledger stays the narrative/rationale
# document; this stays the machine-checkable one. Loaded and schema-checked
# by `tests/unit/test_parity_coverage.py`.
#
# `status` is the row's furthest-reached stage in the ledger's own
# checklist:
#   planned -> adapter_implemented -> unit_tested -> native_tested ->
#   cli_parity_tested -> windows_passed -> linux_passed ->
#   doc_updated -> embedded_default -> cli_removable -> complete
#
# `decision` mirrors the ledger's "Embedded decision/replacement" column:
# direct_rc, composite_rc, bridge, python, deprecate, transitive, remove,
# or runtime (constructor/control-surface rows the 5-category scheme
# doesn't cover).
#
# `windows`/`linux` record whether the row's own tests have been run and
# passed on that platform in this repository - not whether the platform is
# merely supported in principle. `parity_test` is the primary test proving
# the row's current status; rows with no dedicated test yet use `""`.

