[[row]]
id = "T08"
method = "delete_files"
decision = "composite_rc"
owner_module = "rclone_kit.operations.transfer_ops_embedded"
status = "cli_parity_tested"
parity_test = "tests/native/test_copy_files_and_delete_files_embedded_integration.py::test_delete_files_removes_only_the_listed_files"
windows = true
linux = false
failure_contract_complete = true
notes = "Wave E Phase E3. Partitioned operations/delete jobs (fs = the group_files() remote/common-prefix key, _filter.FilesFrom pointing at that partition's temp file), each followed by operations/rmdirs(remote=\"\", leaveRoot=true) when rmdirs=True and that partition's delete succeeded - reproducing the delete command's own --rmdirs sequence (cmd/delete/delete.go), not a new one. Same aggregation/never-abort-collection model as T06. Empirically confirmed: a FilesFrom entry naming a missing file does not raise (operations.Delete simply does not visit it)."

