[[row]]
id = "T03"
method = "copy"
decision = "direct_rc"
owner_module = "rclone_kit.client"
status = "cli_parity_tested"
parity_test = "tests/native/test_start_copy_integration.py::test_copy_matches_cli_and_returns_completed_process"
windows = true
linux = false
notes = "Always async: start_copy() dispatches to rclonekit/copy (Phase D4's retry-aware Go endpoint, not a bare sync/copy call) through JobHandle/_JobMonitor (Phase D3) and blocks via .wait(); copy() applies its historical tuned defaults (checkers 1000, transfers 32, low-level retries 10, retries 3) at its own call site, not baked into TransferOptions itself. The rclonekit/copy Go endpoint is committed locally in the native/rclone submodule (rclone-kit/integration-v1, d498adafa) but not yet pushed to its GitHub remote, so the parent submodule pin has not moved - see native_c_abi_wave_d_review_and_design.md's Phase D4 status note."

