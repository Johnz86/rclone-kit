notes = "Wave E Phase E2. Partitioned rclonekit/copy jobs (not a bare sync/copy - correcting the ledger's original decision to keep F1's retry-loop fix), one per group_files() common-prefix partition, each with _filter.FilesFrom pointing at that partition's own temp file. Every partition is started before any is waited on and every partition is collected before check=True can raise, so a partial failure never loses a still-running sibling's result (native_c_abi_wave_e_review_and_design.md, decision E3). All partitions fold into one OperationResult via _aggregate_results(), with job_ids/attempts spanning every partition - closing the OperationResult.attempts gap (parse_operation_attempts, wired into job.py) for this row and, transitively, for start_copy()/copy() (T03) too. Empirically confirmed: a FilesFrom entry naming a missing source file is silently skipped (not an error), the same as T08's operations/delete."

