failure_contract_complete = true
notes = "Wave H addendum. Unblocked by adding scripts/native/build.py --profile production (-tags cmount, CPATH pointing at the installed WinFsp SDK's fuse headers) - verified empirically end-to-end (real drive-letter mount, read, write, unmount) both via a standalone build and the actual C-shared library loaded through ctypes. mount/mount's vfsOpt/mountOpt parameters are JSON objects keyed by Go struct field names (e.g. 'CacheMode', 'ReadOnly'), NOT this project's usual underscored config: tags - a different convention from every other RC call ported so far. Returns a MountHandle (mount_path/idempotent dispose), not a reuse of the CLI-subprocess-coupled Mount class. cache_dir has no RC equivalent (rclone's --cache-dir sets process-global state via config.SetCacheDir at CLI startup, not a per-mount RC option) so it raises UnsupportedEmbeddedOperationError like other_args."

