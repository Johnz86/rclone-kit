linux = false
notes = "Consolidates with T03's start_copy() engine but without copy()'s tuned defaults (rclone's own defaults apply) and with copy_directory()'s own non-raising failure policy (check=False always). Rejects nonempty args with UnsupportedEmbeddedOperationError rather than silently dropping them."

[[row]]
id = "T05"
method = "copy_remote"
decision = "direct_rc"
owner_module = "rclone_kit.client"
status = "unit_tested"
parity_test = "tests/native/test_start_copy_integration.py::test_copy_remote_never_raises_for_an_unconfigured_remote"
windows = true
linux = false
notes = "Consolidates with T03's start_copy() engine; Remote values convert to their bare root string (\"name:\") via the existing convert_to_str(). Native coverage is for the non-raising-failure and args-rejection paths only - Remote's constructor rejects a colon in its name, so it cannot address an arbitrary local test directory the way copy_dir()'s str/Dir targets can; a real cross-remote transfer is exercised at the unit level (test_copy_remote_dispatches_to_start_copy in test_client_embedded.py) and would need a live or dynamically-registered (config/create) remote for native coverage."

[[row]]
id = "T06"
method = "copy_files"
decision = "composite_rc"
owner_module = "rclone_kit.operations.transfer_ops_embedded"
status = "cli_parity_tested"
parity_test = "tests/native/test_copy_files_and_delete_files_embedded_integration.py::test_copy_files_matches_cli_for_a_selected_subset"
windows = true
linux = false
failure_contract_complete = true
notes = "Wave E Phase E2. Partitioned rclonekit/copy jobs (not a bare sync/copy - correcting the ledger's original decision to keep F1's retry-loop fix), one per group_files() common-prefix partition, each with _filter.FilesFrom pointing at that partition's own temp file. Every partition is started before any is waited on and every partition is collected before check=True can raise, so a partial failure never loses a still-running sibling's result (native_c_abi_wave_e_review_and_design.md, decision E3). All partitions fold into one OperationResult via _aggregate_results(), with job_ids/attempts spanning every partition - closing the OperationResult.attempts gap (parse_operation_attempts, wired into job.py) for this row and, transitively, for start_copy()/copy() (T03) too. Empirically confirmed: a FilesFrom entry naming a missing source file is silently skipped (not an error), the same as T08's operations/delete."

