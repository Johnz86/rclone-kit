[[row]]
id = "R05"
method = "server listing/cleanup"
decision = "direct_rc"
owner_module = "rclone_kit.client"
status = "cli_parity_tested"
parity_test = "tests/native/test_mount_ops_embedded_integration.py::test_close_disposes_mount_handles_the_caller_never_disposed"
windows = true
linux = false
notes = "Wave H, extended in the mount addendum. Rclone tracks every ServeHandle and every MountHandle it starts (self._serve_handles, self._mount_handles) and disposes each in close() (idempotent, so a handle the caller already disposed directly is a no-op) - mirroring _JobMonitor.shutdown()'s established Wave D pattern. mount/listmounts and mount/unmountall are wired (cmd/mountlib registered) and verified empirically but still have no public API of their own (MountHandle only needs mount/unmount for the mounts it itself started)."
