[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "rclone-kit"
readme = "README.md"
description = "rclone api in python"
requires-python = ">=3.13"
keywords = ["rclone", "api", "python", "fast", "sftp", "s3", "backblaze"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "psutil>=7.2.2",
    "httpx>=0.28.1",
]

# Change this with the version number bump.
version = "1.1.1"

[project.optional-dependencies]
s3 = ["boto3>=1.43.51"]
database = ["sqlmodel>=0.0.39"]
postgres = ["rclone-kit[database]", "psycopg2-binary>=2.9.12"]
full = ["rclone-kit[s3,database,postgres]"]

[project.urls]
Homepage = "https://github.com/Johnz86/rclone-kit"
Repository = "https://github.com/Johnz86/rclone-kit"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "pyright>=1.1.411",
    "ruff>=0.15.22",
    # Pinned to the exact [build-system] requires version so
    # tests/unit/test_build_backend.py exercises the same setuptools
    # bdist_wheel implementation the real build uses.
    "setuptools==83.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rclone_kit = ["py.typed", "assets/*", "assets/**/*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["reference", "native"]

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "I",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PYI",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TRY",
    "UP",
    "W",
]

# Suppressions below are narrow, documented exceptions to the curated select
# list above. Each covers a family of findings broad enough to need its own
# reviewed pass rather than an incidental fix. This is a starting point for
# incremental cleanup, not a permanent opt-out: shrink the list as each
# family gets addressed by a dedicated, reviewable change.
#
#   ANN                        - Annotation coverage is still incomplete in the
#                                 older modules (fs/ and the s3 multipart
#                                 uploaders hold most of it); completing it is
#                                 a dedicated typing pass that has not been
#                                 done yet.
#   TRY                        - Exception-handling findings (message wording,
#                                 raise-from-within-try, vanilla exception
#                                 classes) need per-call-site judgment about the
#                                 right exception type and message; triaged in a
#                                 follow-up change.
#   FBT001, FBT002, FBT003     - Positional boolean parameters are concentrated
#                                 in the public API surface (client.py, the
#                                 `operations/` modules, fs/filesystem.py).
#                                 Replacing them with enums touches nearly
#                                 every public signature and its call sites at
#                                 once; that is a broad API-surface change
#                                 owed its own reviewed pass, and it has not
#                                 been done yet.
#   A001, A002                 - Parameter/variable names such as `type`,
#                                 `range`, `dir` shadow builtins (http_server.py,
#                                 operations/walk.py, operations/config_ops.py,
#                                 s3/multipart/upload_parts_resumable.py).
#                                 Renaming keyword-visible parameters ripples
#                                 through every call site and the docs, so it
#                                 belongs to the same unstarted API-surface
#                                 pass as the FBT cleanup above.
#   PLC0415                    - Retained only for explicit lazy boundaries:
#                                 optional database/S3 dependencies imported
#                                 inside a `try` that raises
#                                 `MissingOptionalDependencyError`
#                                 (operations/db_ops.py, operations/s3_ops.py),
#                                 and imports deferred so importing
#                                 config_discovery.py does not pull in the
#                                 native runtime modules, and importing
#                                 operations/copy_file_parts_resumable.py does
#                                 not require `botocore` (imported at module
#                                 level by one of the two multipart uploaders
#                                 it defers).
#   PLR0911, PLR0912, PLR0913,
#   PLR0915                    - Function complexity metrics (too many
#                                 arguments/branches/statements/returns) flag
#                                 functions that need decomposition. Refactoring
#                                 signatures and control flow is a design change
#                                 that has not been done yet.
#   S101                       - `assert` is used pervasively as an internal
#                                 invariant check throughout `src`, not only in
#                                 tests; the s3 multipart modules hold most of
#                                 them. The rule for new code is that anything
#                                 a caller can trip must raise instead of
#                                 assert; converting the remaining runtime-
#                                 facing asserts is separate follow-up work
#                                 that has not been done yet.
#   S603                       - The library itself starts no subprocesses:
#                                 rclone is linked in-process, so `src` has no
#                                 `subprocess.run`/`Popen` call at all. The
#                                 calls this rule flags live in the repo-local
#                                 tooling Ruff also covers (7 in scripts/, 2 in
#                                 tests/unit/), and each passes a `list[str]`
#                                 argument vector with `shell=False`. The rule flags any subprocess
#                                 invocation for manual review regardless of
#                                 that mitigation, so it stays a permanent,
#                                 reviewed acceptance rather than a deferred
#                                 item.
#   PTH                        - `os.path` call sites remain across `src`,
#                                 chiefly in the s3 multipart modules and
#                                 http_server.py. A full `os.path`-to-`pathlib`
#                                 migration is a broad, separate cleanup that
#                                 has not been swept through the codebase.
#   E501                       - Ruff's formatter enforces the line-length
#                                 budget for all reformattable code; the
#                                 stragglers are long string literals
#                                 (docstrings, argparse help text, error
#                                 messages) the formatter intentionally leaves
#                                 alone.
#   DTZ005                     - The single finding is a naive
#                                 `datetime.now()` used to stamp a persisted
#                                 multipart-upload `info.json` resume file.
#                                 Changing its serialized format is a runtime
#                                 behavior change for the resumable-upload
#                                 feature, and has not been done yet.
ignore = [
    "ANN",
    "TRY",
    "FBT001",
    "FBT002",
    "FBT003",
    "A001",
    "A002",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "S101",
    "S603",
    "PTH",
    "E501",
    "DTZ005",
]

[tool.ruff.lint.per-file-ignores]
# Test files load remote credentials/config into UPPERCASE locals to mirror
# production constant style, even though the scope is a function.
#
# PLR2004 is also ignored here, not globally: this project's own test-style
# guide prefers literal expected values in parametrized cases over named
# constants, which is exactly what PLR2004 flags. `src/` has no such
# exception and must name its magic values.
#
# T201 is scoped here rather than ignored globally: the library itself
# routes every runtime diagnostic through a `logging` logger, so a bare
# `print` in `src/rclone_kit/**` is a bug. Tests print for interactive
# debugging, and the entry points below are terminal programs whose stdout
# IS their output.
"tests/**/*.py" = ["N806", "PLR2004", "T201"]

# The packaged console scripts (`rclone-kit-*`) exist to write
# human-readable output to a terminal; that stdout is their product, not a
# stray diagnostic.
"src/rclone_kit/cmd/**/*.py" = ["T201"]

# Repo-local developer tooling (build, distribution verification, native
# smoke tests) is invoked from a shell and reports to stdout/stderr.
"scripts/**/*.py" = ["T201"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.pyright]
# `scripts/` is a sibling of `tests/`, not an ancestor of any test file, so
# Pyright's default implicit-namespace-package directory walk (which is why
# `tests/**/*.py` can already do a bare `from helpers import ...`) does not
# reach it. Declaring it here lets `tests/unit/test_verify_distribution.py`
# do a bare `import verify_distribution`, mirroring the `pythonpath`
# entry pytest itself uses for the same import at test-run time.
extraPaths = ["scripts", "scripts/native"]
# Without these, a bare `uv run pyright` (what an editor's language server
# runs too) reports ~123 errors from code this project does not own or
# type-check: `reference/` is a gitignored vendored checkout of rclone's
# own sources, `native/` is the Go submodule, and `build/`/`dist/` are
# generated. The contributing docs' explicit invocation already listed the
# directories that matter; this makes the default invocation agree with it
# instead of burying real findings in vendored noise.
exclude = [
    "**/__pycache__",
    "**/.venv",
    "build",
    "dist",
    "native",
    "reference",
]
strict = [
    "src/rclone_kit/settings.py",
    "src/rclone_kit/group_files.py",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
# "." lets tests/unit/test_build_backend.py do a bare `import _build_backend`.
pythonpath = ["tests", "scripts", "scripts/native", "."]
markers = [
    "cloud: requires external cloud credentials",
    "mount: requires operating-system mount support",
    "network: requires non-loopback network access",
    "live_s3: exercises the real implementation against a real S3/Ceph remote via rclone-test.conf; run explicitly with `pytest -m live_s3`",
    "live_gdrive: exercises the real implementation against a real Google Drive remote via rclone-gdrive.conf; run explicitly with `pytest -m live_gdrive`",
    "live_gdrive_authorization: drives Rclone.authorize() against a real Google Drive account, blocking on a human approving access in a browser; run explicitly with `pytest -m live_gdrive_authorization`",
]

[project.scripts]
rclone-kit-listfiles = "rclone_kit.cmd.list_files:main"
rclone-kit-copylarge-s3 = "rclone_kit.cmd.copy_large_s3:main"
rclone-kit-save-to-db = "rclone_kit.cmd.save_to_db:main"
